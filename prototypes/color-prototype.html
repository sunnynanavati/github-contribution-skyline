<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Skyline Color Controls</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: #f2f1ed; }
    button, input { font: inherit; }
    #stage { min-height: 100dvh; }
    .prototype-page {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
      color: #181b19;
      background: #f2f1ed;
      font-family: Arial, Helvetica, sans-serif;
    }
    .prototype-header {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 24px 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: #69706b;
      font-size: 12px;
    }
    .prototype-mark { color: #202421; font-weight: 750; letter-spacing: -0.02em; }
    .prototype-main {
      width: min(1180px, calc(100% - 40px));
      min-width: 0;
      margin: 0 auto;
      padding: clamp(30px, 7vh, 76px) 0 112px;
      display: grid;
      align-content: center;
      gap: 28px;
    }
    .prototype-copy { max-width: 730px; }
    .prototype-kicker {
      margin: 0 0 12px;
      color: #9d3439;
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }
    .prototype-copy h1 {
      max-width: 690px;
      margin: 0;
      font-size: clamp(38px, 6vw, 68px);
      line-height: 0.98;
      letter-spacing: -0.06em;
      font-weight: 650;
    }
    .prototype-copy p:last-child {
      max-width: 560px;
      margin: 17px 0 0;
      color: #667069;
      font-size: clamp(14px, 1.5vw, 17px);
      line-height: 1.55;
    }
    github-skyline-color { display: block; min-width: 0; width: 100%; }

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }
    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }
    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
    .proto-picker-replay { padding: 0 10px; font-size: 14px; }
    .proto-picker[data-position="top"] { bottom: auto; top: 24px; }

    @media (prefers-color-scheme: dark) {
      body, .prototype-page { background: #171917; color: #eff2ef; }
      .prototype-mark { color: #eff2ef; }
      .prototype-header, .prototype-copy p:last-child { color: #a6aea8; }
    }
    @media (max-width: 680px) {
      .prototype-header { width: min(100% - 28px, 1180px); padding-top: 18px; }
      .prototype-main { width: min(100% - 20px, 1180px); padding-top: 28px; }
      .prototype-copy { padding: 0 4px; }
      .prototype-copy h1 { font-size: clamp(38px, 12vw, 55px); }
      .proto-picker-item { padding: 0 9px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <main id="stage"></main>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Swatch Rail</button>
    <button class="proto-picker-item">Palette Cards</button>
    <button class="proto-picker-item">Preview Tray</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script>
    const PALETTES = {
      green: {
        label: 'GitHub green', surface: '#fbfcfb', elevated: '#ffffff', ink: '#172019', muted: '#667069',
        border: '#d8ded9', grid: '#e2e7e3', focus: '#2f9e55', levels: ['#e5eae6', '#9be9a8', '#40c463', '#30a14e', '#216e39']
      },
      red: {
        label: 'Signal red', surface: '#1b080b', elevated: '#260d11', ink: '#ffecee', muted: '#c58f94',
        border: '#542127', grid: '#341014', focus: '#ff6568', levels: ['#351115', '#712128', '#a9333a', '#e1494d', '#ff5b5f']
      },
      mono: {
        label: 'Monochrome', surface: '#111213', elevated: '#1a1b1d', ink: '#f4f4f2', muted: '#9a9da0',
        border: '#393b3e', grid: '#25272a', focus: '#d7d9dc', levels: ['#282a2d', '#55585d', '#858a90', '#c0c4c8', '#f1f2ef']
      },
      orange: {
        label: 'Ember orange', surface: '#1d0f08', elevated: '#28140a', ink: '#fff0e6', muted: '#c79a7d',
        border: '#56301d', grid: '#35190c', focus: '#ff9e48', levels: ['#37190b', '#753313', '#ac4c1a', '#e87324', '#ffad4a']
      },
      blue: {
        label: 'Ocean blue', surface: '#071522', elevated: '#0b1d2c', ink: '#e9f6ff', muted: '#89aabe',
        border: '#21435b', grid: '#102b3f', focus: '#58b8eb', levels: ['#102a3d', '#185176', '#207caf', '#3aa7df', '#8ad9ff']
      },
      yellow: {
        label: 'Solar yellow', surface: '#191507', elevated: '#221d09', ink: '#fff9dc', muted: '#b9aa70',
        border: '#514518', grid: '#302807', focus: '#f1cd3f', levels: ['#322909', '#70590a', '#a98510', '#dcb31c', '#ffe36b']
      }
    };
    const PALETTE_KEYS = Object.keys(PALETTES);
    const LEVEL_HEIGHTS = [0.06, 0.22, 0.46, 0.73, 1];

    function mulberry32(seed) {
      return function random() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function makeContributions() {
      const random = mulberry32(20260924);
      return Array.from({ length: 53 }, (_, week) =>
        Array.from({ length: 7 }, (_, day) => {
          const season = 0.16 * Math.sin(week * 0.36) + 0.12 * Math.cos((week + day) * 0.61);
          const sprint = week > 16 && week < 24 ? 0.22 : 0;
          const release = week > 39 && week < 45 ? 0.3 : 0;
          const weekend = day === 0 || day === 6 ? -0.14 : 0;
          const score = random() + season + sprint + release + weekend;
          if (score < 0.43) return 0;
          if (score < 0.66) return 1;
          if (score < 0.84) return 2;
          if (score < 1.01) return 3;
          return 4;
        })
      );
    }

    const CONTRIBUTIONS = makeContributions();

    class GitHubSkylineColor extends HTMLElement {
      connectedCallback() {
        this.controlStyle = this.getAttribute('control-style') || 'rail';
        const requestedPalette = new URLSearchParams(location.search).get('palette');
        this.settings = { palette: PALETTES[requestedPalette] ? requestedPalette : 'red', buildingDetail: true, heightScale: 1 };
        this.settingsOpen = this.controlStyle === 'cards';
        this.progress = 0;
        this.target = 0;
        this.lastTime = performance.now();
        this.raf = 0;
        this.resizeObserver = new ResizeObserver(() => this.resize());
        this.attachShadow({ mode: 'open' });
        this.render();
        this.cacheElements();
        this.bindEvents();
        this.applyPalette();
        this.resizeObserver.observe(this.shell);
        this.resize();
        this.animate(performance.now());
      }

      render() {
        const paletteControls = this.controlStyle === 'rail' ? this.railControls() : this.controlStyle === 'cards' ? this.cardControls() : '';
        const tray = this.controlStyle === 'tray' ? this.trayControls() : '';
        this.shadowRoot.innerHTML = `
          <style>
            :host {
              --surface: #1b080b; --elevated: #260d11; --ink: #ffecee; --muted: #c58f94;
              --border: #542127; --grid: #341014; --focus: #ff6568;
              display: block; width: 100%;
            }
            * { box-sizing: border-box; }
            button, input { font: inherit; }
            .shell {
              position: relative;
              min-height: clamp(400px, 55vw, 650px);
              overflow: hidden;
              border: 1px solid var(--border);
              border-radius: 20px;
              background: var(--surface);
              box-shadow: 0 24px 72px rgb(31 24 22 / .17);
              outline: none;
              transition: background-color 180ms ease-out, border-color 180ms ease-out;
            }
            .shell:focus-visible { box-shadow: 0 0 0 3px var(--focus), 0 24px 72px rgb(31 24 22 / .17); }
            canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
            .topline {
              position: absolute; z-index: 2; inset: 18px 20px auto;
              display: flex; justify-content: space-between; gap: 20px;
              color: var(--ink); pointer-events: none;
              font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
            }
            .hint { margin-right: 92px; color: var(--muted); font-weight: 500; }
            .details-toggle {
              position: absolute; z-index: 5; top: 12px; right: 14px;
              min-width: 82px; height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
              padding: 0 11px; border: 1px solid var(--border); border-radius: 999px;
              background: color-mix(in srgb, var(--elevated) 92%, transparent); color: var(--ink);
              cursor: pointer; font: 650 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
              -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
              transition: transform 160ms ease-out, background-color 160ms ease-out, border-color 160ms ease-out;
            }
            .details-toggle:hover { background: var(--elevated); }
            .details-toggle:active { transform: scale(.97); }
            .details-toggle:focus-visible, .palette-button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
            .sliders-icon { width: 13px; display: grid; gap: 2px; }
            .sliders-icon i { display: block; height: 1px; background: currentColor; }
            .sliders-icon i:nth-child(2) { width: 8px; margin-left: 4px; }
            .settings-panel {
              position: absolute; z-index: 4; top: 52px; right: 14px;
              width: 258px; padding: 14px;
              border: 1px solid var(--border); border-radius: 14px;
              background: color-mix(in srgb, var(--elevated) 95%, transparent); color: var(--ink);
              box-shadow: 0 16px 46px rgb(0 0 0 / .22);
              -webkit-backdrop-filter: blur(18px) saturate(1.12); backdrop-filter: blur(18px) saturate(1.12);
              opacity: 0; transform: translateY(-7px) scale(.98); transform-origin: top right;
              pointer-events: none;
              transition: opacity 180ms ease-out, transform 180ms cubic-bezier(.2,.8,.2,1), background-color 180ms ease-out;
              font: 500 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
            }
            :host([control-style='cards']) .settings-panel { width: 330px; }
            .settings-panel[data-open] { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
            .settings-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
            .settings-head strong { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
            .reset { padding: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; font: inherit; }
            .reset:hover { color: var(--ink); }
            .setting-row {
              min-height: 34px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
              border-top: 1px solid var(--border);
            }
            .switch { position: relative; width: 30px; height: 18px; flex: 0 0 auto; }
            .switch input { position: absolute; opacity: 0; pointer-events: none; }
            .track { position: absolute; inset: 0; border-radius: 999px; background: var(--border); cursor: pointer; transition: background-color 160ms ease-out; }
            .track::after {
              content: ''; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px;
              border-radius: 50%; background: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .25);
              transition: transform 180ms cubic-bezier(.2,.8,.2,1);
            }
            .switch input:checked + .track { background: var(--focus); }
            .switch input:checked + .track::after { transform: translateX(12px); }
            .switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }
            .range-row { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
            .range-meta { display: flex; justify-content: space-between; color: var(--muted); }
            input[type='range'] { width: 100%; accent-color: var(--focus); cursor: pointer; }
            .palette-label { display: flex; justify-content: space-between; padding: 11px 0 8px; border-top: 1px solid var(--border); color: var(--muted); }
            .palette-label output { color: var(--ink); }
            .rail { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-bottom: 8px; }
            .palette-button { border: 0; cursor: pointer; }
            .rail .palette-button {
              position: relative; width: 28px; height: 28px; padding: 0; border-radius: 50%;
              background: var(--sample); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .16);
              transition: transform 160ms ease-out, box-shadow 160ms ease-out;
            }
            .rail .palette-button:hover { transform: translateY(-2px); }
            .rail .palette-button[aria-pressed='true'] { box-shadow: 0 0 0 2px var(--elevated), 0 0 0 4px var(--focus); }
            .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 2px 0 10px; }
            .card-grid .palette-button {
              display: grid; gap: 8px; padding: 10px; text-align: left;
              color: var(--ink); background: color-mix(in srgb, var(--surface) 68%, transparent);
              border: 1px solid var(--border); border-radius: 10px;
              transition: transform 160ms ease-out, border-color 160ms ease-out, background-color 160ms ease-out;
            }
            .card-grid .palette-button:hover { transform: translateY(-2px); background: var(--surface); }
            .card-grid .palette-button[aria-pressed='true'] { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
            .ramp { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
            .ramp i { height: 12px; border-radius: 2px; }
            .card-name { color: var(--muted); font-size: 10px; }
            .card-grid .palette-button[aria-pressed='true'] .card-name { color: var(--ink); }
            .palette-tray {
              position: absolute; z-index: 4; left: 50%; bottom: 15px; transform: translateX(-50%);
              width: min(770px, calc(100% - 28px)); display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
              padding: 5px; border: 1px solid var(--border); border-radius: 15px;
              background: color-mix(in srgb, var(--elevated) 93%, transparent);
              box-shadow: 0 14px 40px rgb(0 0 0 / .18);
              -webkit-backdrop-filter: blur(18px) saturate(1.12); backdrop-filter: blur(18px) saturate(1.12);
            }
            .palette-tray .palette-button {
              min-width: 0; padding: 7px 8px; border-radius: 10px; color: var(--muted); background: transparent;
              text-align: left; transition: background-color 160ms ease-out, color 160ms ease-out, transform 160ms ease-out;
            }
            .palette-tray .palette-button:hover { color: var(--ink); transform: translateY(-1px); }
            .palette-tray .palette-button[aria-pressed='true'] { color: var(--ink); background: var(--surface); }
            .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 7px; }
            .mini-grid i { aspect-ratio: 1; border-radius: 1px; background: var(--cell); }
            .tray-name { display: block; overflow: hidden; font: 600 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
            .legend {
              position: absolute; z-index: 2; left: 20px; bottom: 18px;
              display: flex; align-items: center; gap: 5px; color: var(--muted); pointer-events: none;
              font: 500 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
            }
            :host([control-style='tray']) .legend { bottom: 88px; }
            .swatch { width: 10px; height: 10px; border-radius: 2px; }
            .tooltip {
              position: absolute; z-index: 3; opacity: 0; pointer-events: none;
              padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px;
              background: var(--elevated); color: var(--ink); box-shadow: 0 8px 28px rgb(0 0 0 / .22);
              transform: translate(-50%, -115%); font: 600 11px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace;
              transition: opacity 120ms ease-out; white-space: nowrap;
            }
            @media (max-width: 680px) {
              .shell { min-height: 470px; border-radius: 14px; }
              .topline { inset: 14px 14px auto; }
              .hint { display: none; }
              .topline span:first-child { max-width: calc(100% - 96px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
              .details-toggle { top: 10px; right: 10px; }
              .settings-panel, :host([control-style='cards']) .settings-panel { top: 50px; right: 10px; width: min(330px, calc(100% - 20px)); }
              .palette-tray { grid-template-columns: repeat(3, 1fr); bottom: 10px; }
              .palette-tray .palette-button { padding: 6px; }
              :host([control-style='tray']) .legend { display: none; }
            }
            @media (prefers-reduced-motion: reduce) {
              .shell, .settings-panel, .details-toggle, .track, .track::after, .palette-button { transition: none; }
            }
          </style>
          <section class="shell" tabindex="0" aria-label="GitHub contribution skyline. Hover or focus to view the standard contribution graph.">
            <canvas role="img" aria-label="One year of GitHub contributions shown as a three-dimensional skyline"></canvas>
            <div class="topline"><span>github.com/sunny / 1,247 contributions</span><span class="hint">HOVER TO FLATTEN</span></div>
            <button class="details-toggle" type="button" aria-expanded="${this.settingsOpen}" aria-controls="skyline-settings">
              <span class="sliders-icon" aria-hidden="true"><i></i><i></i><i></i></span>${this.controlStyle === 'cards' ? 'Palette' : 'Details'}
            </button>
            <div class="settings-panel" id="skyline-settings" aria-hidden="${!this.settingsOpen}" ${this.settingsOpen ? 'data-open' : ''}>
              <div class="settings-head"><strong>${this.controlStyle === 'cards' ? 'Skyline palette' : 'Skyline details'}</strong><button class="reset" type="button">Reset</button></div>
              ${paletteControls}
              <label class="setting-row"><span>Building detail</span><span class="switch"><input name="buildingDetail" type="checkbox" checked><i class="track"></i></span></label>
              <label class="range-row"><span class="range-meta"><span>Height scale</span><output>100%</output></span><input name="heightScale" type="range" min="60" max="140" value="100" step="5"></label>
            </div>
            ${tray}
            <div class="legend"><span>Less</span><span class="legend-colors"></span><span>More</span></div>
            <div class="tooltip"></div>
          </section>`;
      }

      railControls() {
        return `<div class="palette-label"><span>Color</span><output>${PALETTES[this.settings.palette].label}</output></div>
          <div class="rail" role="group" aria-label="Skyline color">
            ${PALETTE_KEYS.map(key => `<button class="palette-button" type="button" data-palette="${key}" aria-label="${PALETTES[key].label}" aria-pressed="${key === this.settings.palette}" style="--sample:${PALETTES[key].levels[4]}"></button>`).join('')}
          </div>`;
      }

      cardControls() {
        return `<div class="card-grid" role="group" aria-label="Skyline color">
          ${PALETTE_KEYS.map(key => `<button class="palette-button" type="button" data-palette="${key}" aria-pressed="${key === this.settings.palette}">
            <span class="ramp">${PALETTES[key].levels.map(color => `<i style="background:${color}"></i>`).join('')}</span>
            <span class="card-name">${PALETTES[key].label}</span>
          </button>`).join('')}
        </div>`;
      }

      trayControls() {
        const pattern = [0, 2, 4, 1, 3, 4, 2, 1, 4, 3, 0, 2, 4, 1];
        return `<div class="palette-tray" role="group" aria-label="Skyline color">
          ${PALETTE_KEYS.map(key => `<button class="palette-button" type="button" data-palette="${key}" aria-pressed="${key === this.settings.palette}">
            <span class="mini-grid">${pattern.map(level => `<i style="--cell:${PALETTES[key].levels[level]}"></i>`).join('')}</span>
            <span class="tray-name">${PALETTES[key].label}</span>
          </button>`).join('')}
        </div>`;
      }

      cacheElements() {
        this.shell = this.shadowRoot.querySelector('.shell');
        this.canvas = this.shadowRoot.querySelector('canvas');
        this.context = this.canvas.getContext('2d');
        this.tooltip = this.shadowRoot.querySelector('.tooltip');
        this.detailsToggle = this.shadowRoot.querySelector('.details-toggle');
        this.settingsPanel = this.shadowRoot.querySelector('.settings-panel');
      }

      bindEvents() {
        this.onEnter = () => this.setTarget(1);
        this.onLeave = () => { this.setTarget(0); this.tooltip.style.opacity = 0; };
        this.onMove = event => this.updateTooltip(event);
        this.canvas.addEventListener('pointerenter', this.onEnter);
        this.canvas.addEventListener('pointerleave', this.onLeave);
        this.canvas.addEventListener('pointermove', this.onMove);
        this.shell.addEventListener('focus', this.onEnter);
        this.shell.addEventListener('blur', this.onLeave);
        this.detailsToggle.addEventListener('click', () => this.toggleSettings());
        this.shadowRoot.addEventListener('click', event => {
          const button = event.target.closest('[data-palette]');
          if (button) this.selectPalette(button.dataset.palette);
        });
        this.settingsPanel.addEventListener('change', event => this.updateSetting(event));
        this.settingsPanel.addEventListener('input', event => this.updateSetting(event));
        this.settingsPanel.querySelector('.reset').addEventListener('click', () => this.resetSettings());
      }

      toggleSettings() {
        this.settingsOpen = !this.settingsOpen;
        this.settingsPanel.toggleAttribute('data-open', this.settingsOpen);
        this.settingsPanel.setAttribute('aria-hidden', String(!this.settingsOpen));
        this.detailsToggle.setAttribute('aria-expanded', String(this.settingsOpen));
      }

      selectPalette(key) {
        if (!PALETTES[key]) return;
        this.settings.palette = key;
        const url = new URL(location);
        url.searchParams.set('palette', key);
        history.replaceState(null, '', url);
        this.applyPalette();
      }

      applyPalette() {
        const palette = PALETTES[this.settings.palette];
        const style = this.style;
        style.setProperty('--surface', palette.surface);
        style.setProperty('--elevated', palette.elevated);
        style.setProperty('--ink', palette.ink);
        style.setProperty('--muted', palette.muted);
        style.setProperty('--border', palette.border);
        style.setProperty('--grid', palette.grid);
        style.setProperty('--focus', palette.focus);
        this.shadowRoot.querySelectorAll('[data-palette]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.palette === this.settings.palette)));
        const output = this.shadowRoot.querySelector('.palette-label output');
        if (output) output.textContent = palette.label;
        this.shadowRoot.querySelector('.legend-colors').innerHTML = palette.levels.map(color => `<i class="swatch" style="display:inline-block;background:${color};margin-right:5px"></i>`).join('');
        this.draw();
      }

      updateSetting(event) {
        const input = event.target;
        if (!input.name) return;
        if (input.type === 'range') {
          this.settings.heightScale = Number(input.value) / 100;
          this.settingsPanel.querySelector('.range-meta output').textContent = `${input.value}%`;
        } else {
          this.settings[input.name] = input.checked;
        }
        this.draw();
      }

      resetSettings() {
        this.settings = { palette: 'red', buildingDetail: true, heightScale: 1 };
        for (const input of this.settingsPanel.querySelectorAll('input')) {
          if (input.type === 'range') input.value = '100';
          else input.checked = true;
        }
        const output = this.settingsPanel.querySelector('.range-meta output');
        if (output) output.textContent = '100%';
        const url = new URL(location);
        url.searchParams.set('palette', 'red');
        history.replaceState(null, '', url);
        this.applyPalette();
      }

      disconnectedCallback() {
        cancelAnimationFrame(this.raf);
        this.resizeObserver?.disconnect();
      }

      setTarget(value) {
        this.target = value;
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          this.progress = value;
          this.draw();
        }
      }

      resize() {
        const rect = this.shell.getBoundingClientRect();
        const ratio = Math.min(devicePixelRatio || 1, 2);
        this.width = rect.width;
        this.height = rect.height;
        this.canvas.width = Math.max(1, Math.round(rect.width * ratio));
        this.canvas.height = Math.max(1, Math.round(rect.height * ratio));
        this.context.setTransform(ratio, 0, 0, ratio, 0, 0);
        this.draw();
      }

      animate(time) {
        const dt = Math.min(32, time - this.lastTime);
        this.lastTime = time;
        const delta = 1 - Math.pow(1 - 0.24, dt / 16.67);
        this.progress += (this.target - this.progress) * delta;
        if (Math.abs(this.target - this.progress) < 0.001) this.progress = this.target;
        this.draw();
        this.raf = requestAnimationFrame(next => this.animate(next));
      }

      geometry() {
        const compact = this.width < 640;
        const traySpace = this.controlStyle === 'tray' ? (compact ? 120 : 80) : 0;
        const flatCell = Math.min((this.width - (compact ? 30 : 90)) / 53, (this.height - 125 - traySpace) / 7);
        const flatW = flatCell * 0.78;
        const flatGridWidth = flatCell * 53;
        const flatGridHeight = flatCell * 7;
        const flatLeft = (this.width - flatGridWidth) / 2;
        const flatTop = (this.height - traySpace - flatGridHeight) / 2 + 5;
        const sidePadding = compact ? 22 : 86;
        const verticalPadding = compact ? 108 + traySpace : 132 + traySpace;
        const isoWFromWidth = (this.width - sidePadding) / 60;
        const isoWFromHeight = (this.height - verticalPadding - 78) / (59 * (0.41 / 0.82));
        const isoW = Math.max(3, Math.min(isoWFromWidth, isoWFromHeight));
        const isoH = isoW * (0.41 / 0.82);
        return { compact, flatCell, flatW, flatLeft, flatTop, isoW, isoH, isoCenterX: this.width * 0.5 - 23 * isoW, isoCenterY: (compact ? 66 : 60) + 78 };
      }

      isoPoint(col, row, z, geometry) {
        return { x: geometry.isoCenterX + (col - row) * geometry.isoW, y: geometry.isoCenterY + (col + row) * geometry.isoH - z };
      }

      flatCorners(col, row, geometry) {
        const x = geometry.flatLeft + col * geometry.flatCell + (geometry.flatCell - geometry.flatW) / 2;
        const y = geometry.flatTop + row * geometry.flatCell + (geometry.flatCell - geometry.flatW) / 2;
        return [{ x, y }, { x: x + geometry.flatW, y }, { x: x + geometry.flatW, y: y + geometry.flatW }, { x, y: y + geometry.flatW }];
      }

      mixPoint(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }

      shade(hex, factor) {
        const value = parseInt(hex.slice(1), 16);
        const r = Math.round(((value >> 16) & 255) * factor);
        const g = Math.round(((value >> 8) & 255) * factor);
        const b = Math.round((value & 255) * factor);
        return `rgb(${Math.min(r, 255)},${Math.min(g, 255)},${Math.min(b, 255)})`;
      }

      path(points, fill, alpha = 1) {
        const context = this.context;
        context.globalAlpha = alpha;
        context.beginPath();
        context.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) context.lineTo(points[i].x, points[i].y);
        context.closePath();
        context.fillStyle = fill;
        context.fill();
        context.globalAlpha = 1;
      }

      drawBuilding(col, row, level, geometry) {
        const palette = PALETTES[this.settings.palette];
        const t = this.progress;
        const inset = 0.1;
        const buildingHeight = level === 0 ? 2.2 : LEVEL_HEIGHTS[level] * 78 * this.settings.heightScale;
        const isoBase = [
          this.isoPoint(col + inset, row + inset, 0, geometry),
          this.isoPoint(col + 1 - inset, row + inset, 0, geometry),
          this.isoPoint(col + 1 - inset, row + 1 - inset, 0, geometry),
          this.isoPoint(col + inset, row + 1 - inset, 0, geometry)
        ];
        const isoTop = isoBase.map(point => ({ x: point.x, y: point.y - buildingHeight }));
        const flat = this.flatCorners(col, row, geometry);
        const top = isoTop.map((point, index) => this.mixPoint(point, flat[index], t));
        const base = isoBase.map((point, index) => this.mixPoint(point, flat[index], t));
        const color = palette.levels[level];
        const sideAlpha = Math.max(0, 1 - t);
        if (level > 0 || t < 0.98) {
          this.path([top[1], top[2], base[2], base[1]], this.shade(color, 0.68), sideAlpha);
          this.path([top[2], top[3], base[3], base[2]], this.shade(color, 0.5), sideAlpha);
        }
        this.path(top, color);
        const signature = level === 4 || (level === 3 && (col * 7 + row) % 4 === 0);
        if (this.settings.buildingDetail && signature && t < 0.82) {
          const styles = ['artDeco', 'angledMast', 'pyramid', 'mechanical'];
          this.drawRoofDetail(styles[(col * 11 + row * 3) % styles.length], top, color, 1 - t);
        }
      }

      drawRoofDetail(style, top, color, visibility) {
        const context = this.context;
        const center = top.reduce((sum, point) => ({ x: sum.x + point.x / 4, y: sum.y + point.y / 4 }), { x: 0, y: 0 });
        const roofWidth = Math.max(3, Math.abs(top[1].x - top[3].x) * 0.48);
        context.save();
        context.globalAlpha = visibility;
        if (style === 'artDeco') {
          for (let tier = 0; tier < 3; tier++) {
            const scale = 0.72 - tier * 0.16;
            const lift = 3 + tier * 4;
            const tierTop = top.map(point => ({ x: center.x + (point.x - center.x) * scale, y: center.y + (point.y - center.y) * scale - lift }));
            const tierBase = tierTop.map(point => ({ x: point.x, y: point.y + 4 }));
            this.path([tierTop[1], tierTop[2], tierBase[2], tierBase[1]], this.shade(color, 0.64), visibility);
            this.path([tierTop[2], tierTop[3], tierBase[3], tierBase[2]], this.shade(color, 0.48), visibility);
            this.path(tierTop, this.shade(color, 1.05), visibility);
          }
          context.strokeStyle = this.shade(color, 0.58); context.lineWidth = 1.2; context.beginPath();
          context.moveTo(center.x, center.y - 11); context.lineTo(center.x, center.y - 25); context.stroke();
        } else if (style === 'pyramid') {
          const apex = { x: center.x, y: center.y - 18 };
          this.path([top[0], top[1], apex], this.shade(color, 1.08), visibility);
          this.path([top[1], top[2], apex], this.shade(color, 0.68), visibility);
          this.path([top[2], top[3], apex], this.shade(color, 0.5), visibility);
          context.strokeStyle = this.shade(color, 0.54); context.lineWidth = 1; context.beginPath();
          context.moveTo(apex.x, apex.y); context.lineTo(apex.x, apex.y - 9); context.stroke();
        } else {
          const scale = style === 'angledMast' ? 0.55 : 0.65;
          const roof = top.map(point => ({ x: center.x + (point.x - center.x) * scale, y: center.y + (point.y - center.y) * scale - 4 }));
          const base = roof.map(point => ({ x: point.x, y: point.y + 5 }));
          this.path([roof[1], roof[2], base[2], base[1]], this.shade(color, 0.62), visibility);
          this.path([roof[2], roof[3], base[3], base[2]], this.shade(color, 0.47), visibility);
          this.path(roof, this.shade(color, 1.04), visibility);
          context.strokeStyle = this.shade(color, 0.55); context.lineWidth = 1.1; context.beginPath();
          const mastX = style === 'angledMast' ? center.x + roofWidth * 0.12 : center.x;
          context.moveTo(center.x - roofWidth * 0.3, center.y - 6); context.lineTo(mastX, center.y - 17);
          context.lineTo(mastX, center.y - 28); context.stroke();
        }
        context.restore();
      }

      draw() {
        if (!this.context || !this.width || !this.height) return;
        const palette = PALETTES[this.settings.palette];
        const context = this.context;
        const geometry = this.geometry();
        context.clearRect(0, 0, this.width, this.height);
        context.fillStyle = palette.surface;
        context.fillRect(0, 0, this.width, this.height);
        if (this.settings.palette === 'red') this.drawTexture();
        const all = [];
        for (let week = 0; week < 53; week++) for (let day = 0; day < 7; day++) all.push({ week, day, level: CONTRIBUTIONS[week][day] });
        all.sort((a, b) => (a.week + a.day) - (b.week + b.day));
        for (const cell of all) this.drawBuilding(cell.week, cell.day, cell.level, geometry);
        if (this.progress > 0.7) this.drawLabels(geometry, (this.progress - 0.7) / 0.3);
      }

      drawTexture() {
        const context = this.context;
        context.save();
        context.globalAlpha = 0.16;
        context.strokeStyle = '#5b1d22';
        context.lineWidth = 1;
        for (let x = -this.height; x < this.width + this.height; x += 8) {
          context.beginPath(); context.moveTo(x, 0); context.lineTo(x - this.height, this.height); context.stroke();
        }
        context.restore();
      }

      drawLabels(geometry, alpha) {
        const palette = PALETTES[this.settings.palette];
        const context = this.context;
        context.fillStyle = palette.muted;
        context.globalAlpha = alpha;
        context.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';
        const months = [['Oct', 0], ['Nov', 5], ['Dec', 9], ['Jan', 14], ['Feb', 18], ['Mar', 22], ['Apr', 27], ['May', 31], ['Jun', 36], ['Jul', 40], ['Aug', 45], ['Sep', 49]];
        for (const [label, week] of months) context.fillText(label, geometry.flatLeft + week * geometry.flatCell, geometry.flatTop - 10);
        if (!geometry.compact) {
          context.fillText('Mon', geometry.flatLeft - 30, geometry.flatTop + geometry.flatCell * 2 - 1);
          context.fillText('Wed', geometry.flatLeft - 30, geometry.flatTop + geometry.flatCell * 4 - 1);
          context.fillText('Fri', geometry.flatLeft - 30, geometry.flatTop + geometry.flatCell * 6 - 1);
        }
        context.globalAlpha = 1;
      }

      updateTooltip(event) {
        if (this.progress < 0.92) { this.tooltip.style.opacity = 0; return; }
        const geometry = this.geometry();
        const rect = this.shell.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const week = Math.floor((x - geometry.flatLeft) / geometry.flatCell);
        const day = Math.floor((y - geometry.flatTop) / geometry.flatCell);
        if (week < 0 || week > 52 || day < 0 || day > 6) { this.tooltip.style.opacity = 0; return; }
        const level = CONTRIBUTIONS[week][day];
        const counts = [0, 2, 7, 15, 31];
        const date = new Date(2025, 8, 28 + week * 7 + day);
        this.tooltip.textContent = `${counts[level]} contributions / ${date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
        this.tooltip.style.left = `${x}px`;
        this.tooltip.style.top = `${y}px`;
        this.tooltip.style.opacity = 1;
      }
    }

    customElements.define('github-skyline-color', GitHubSkylineColor);

    function page(controlStyle, description) {
      return `<div class="prototype-page">
        <header class="prototype-header"><span class="prototype-mark">SUNNY / ENGINEER</span><span>Selected work / 2026</span></header>
        <div class="prototype-main">
          <div class="prototype-copy"><p class="prototype-kicker">Color controls</p><h1>A skyline with its own atmosphere.</h1><p>${description}</p></div>
          <github-skyline-color control-style="${controlStyle}"></github-skyline-color>
        </div>
      </div>`;
    }

    const variants = [
      () => page('rail', 'Fast color switching in the existing settings panel. Six compact swatches keep the control light and familiar.'),
      () => page('cards', 'Named palette cards expose the full contribution ramp before selection. This is the clearest option for an open-source component.'),
      () => page('tray', 'A persistent visual tray makes color part of the experience. Mini contribution previews show each palette in context.')
    ];

    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
