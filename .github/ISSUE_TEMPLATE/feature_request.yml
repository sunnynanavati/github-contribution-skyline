name: Feature request
description: Propose a focused addition
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Use case
      description: What user or integration problem should this solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Accessibility and performance impact
    validations:
      required: true
